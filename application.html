<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Control</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
        #calibration_btn {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background-color: #0066ff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            z-index: 10;
        }
    </style>
</head>
<body>
    <button id="calibration_btn">Calibrate</button>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);
        
        // Create blue cuboid
        const geometry = new THREE.BoxGeometry(2, 0.6, 4);
        const material = new THREE.MeshStandardMaterial({ color: 0x0066ff });
        const cuboid = new THREE.Mesh(geometry, material);
        cuboid.rotation.order = 'YXZ';
        scene.add(cuboid);

        // Add lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(5, 5, 5);
        scene.add(directionalLight);
        
        // Position camera
        camera.position.z = 4;
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);            
            renderer.render(scene, camera);
        }
        
        animate();

        // websocket
        var ws = new WebSocket("/?clientType=display");
        var motion_data;
        var alpha_zero = 0;
        ws.onmessage = (event) => {
            motion_data = JSON.parse(event.data);
            cuboid.rotation.y = THREE.MathUtils.degToRad(motion_data.alpha - alpha_zero);
            cuboid.rotation.x = THREE.MathUtils.degToRad(motion_data.beta);
            cuboid.rotation.z = -THREE.MathUtils.degToRad(motion_data.gamma);
        };

        // calibration
        document.getElementById('calibration_btn').addEventListener('click', () => {
            alpha_zero = motion_data.alpha;
        });
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
